---
# Demo: Service Environment Variables
# This demonstrates how Kubernetes automatically injects service discovery
# environment variables into pods for all services in the same namespace.
#
# Usage:
# 1. kubectl apply -f examples/service-env-vars-demo.yaml
# 2. kubectl get pods -o wide
# 3. curl http://<pod-ip>
# 4. Check the "Environment" section to see auto-injected service variables

apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: default
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: default
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
# Expected environment variables in the test-app pod:
#
# KUBERNETES_SERVICE_HOST=10.96.0.1
# KUBERNETES_SERVICE_PORT=443
# KUBERNETES_SERVICE_PORT_HTTPS=443
# KUBERNETES_PORT=tcp://10.96.0.1:443
# KUBERNETES_PORT_443_TCP=tcp://10.96.0.1:443
# KUBERNETES_PORT_443_TCP_PROTO=tcp
# KUBERNETES_PORT_443_TCP_PORT=443
# KUBERNETES_PORT_443_TCP_ADDR=10.96.0.1
#
# REDIS_MASTER_SERVICE_HOST=<cluster-ip>
# REDIS_MASTER_SERVICE_PORT=6379
# REDIS_MASTER_SERVICE_PORT_REDIS=6379
# REDIS_MASTER_PORT=tcp://<cluster-ip>:6379
# REDIS_MASTER_PORT_6379_TCP=tcp://<cluster-ip>:6379
# REDIS_MASTER_PORT_6379_TCP_PROTO=tcp
# REDIS_MASTER_PORT_6379_TCP_PORT=6379
# REDIS_MASTER_PORT_6379_TCP_ADDR=<cluster-ip>
#
# WEB_SERVICE_SERVICE_HOST=<cluster-ip>
# WEB_SERVICE_SERVICE_PORT=80
# WEB_SERVICE_SERVICE_PORT_HTTP=80
# WEB_SERVICE_SERVICE_PORT_METRICS=9090
# WEB_SERVICE_PORT=tcp://<cluster-ip>:80
# WEB_SERVICE_PORT_80_TCP=tcp://<cluster-ip>:80
# WEB_SERVICE_PORT_80_TCP_PROTO=tcp
# WEB_SERVICE_PORT_80_TCP_PORT=80
# WEB_SERVICE_PORT_80_TCP_ADDR=<cluster-ip>
# WEB_SERVICE_PORT_9090_TCP=tcp://<cluster-ip>:9090
# WEB_SERVICE_PORT_9090_TCP_PROTO=tcp
# WEB_SERVICE_PORT_9090_TCP_PORT=9090
# WEB_SERVICE_PORT_9090_TCP_ADDR=<cluster-ip>
